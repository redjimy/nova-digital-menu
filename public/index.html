<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova Digital Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0c231c;--card:#133429;--line:#24483b;--gold:#e3a72f;--tx:#f6f0e0;--mut:#9fb5aa;--red:#d9503f;--ok:#5fd08b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,system-ui,sans-serif;min-height:100vh;padding-bottom:110px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}.wide{max-width:1100px}
.hero{padding:calc(34px + env(safe-area-inset-top)) 18px 22px;text-align:center;background:radial-gradient(120% 100% at 50% 0,#1a5040,var(--bg))}
.crest{width:60px;height:60px;margin:0 auto 10px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font:700 21px Fraunces,serif;color:var(--gold)}
.hero h1{font-size:30px;line-height:1.1}.hero p{color:var(--mut);margin-top:6px}
.srch{margin:-6px 0 12px}.srch input{margin:0;padding:13px 16px;border-radius:14px}
.tabs{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.tabs button{padding:10px 20px;border-radius:99px;background:var(--card);color:var(--mut);font-weight:700;white-space:nowrap}
.tabs button.on{background:var(--gold);color:#241800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;height:120px;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,#1d4a3a,#0e2b22)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chip{position:absolute;top:8px;right:8px;background:#000a;border-radius:99px;padding:2px 10px;font:600 12px Manrope}
.in{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.in h3{font-size:17px;line-height:1.2}.pr{color:var(--gold);font-weight:700}
.add{background:var(--gold);color:#241800;padding:9px;border-radius:10px;font-weight:700;margin-top:auto}
.q{display:flex;align-items:center;justify-content:space-between;margin-top:auto}.q button{width:34px;height:34px;border-radius:10px;background:var(--gold);color:#241800;font-size:18px;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 60%,transparent)}
.btn{display:flex;justify-content:space-between;width:100%;max-width:720px;margin:0 auto;padding:16px 20px;border-radius:14px;background:var(--gold);color:#241800;font-weight:700}
.btn.solid{justify-content:center}.btn.ghost{background:none;border:1.5px solid var(--gold);color:var(--gold)}
.foot{display:block;text-align:center;color:var(--mut);font-size:12px;margin:26px 0;text-decoration:none}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:720px;margin:0 auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;border:1px solid var(--line)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ln .q{margin:0;gap:8px}.ln .q button{width:28px;height:28px;font-size:15px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:6px 0 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.steps{margin:22px 0}.st{display:flex;gap:16px;padding-bottom:24px;position:relative;opacity:.4}
.st:not(:last-child):before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.st .d{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--bg)}
.st.done{opacity:1}.st.done .d{background:var(--ok);border-color:var(--ok);color:#06210f}
.st.act{opacity:1}.st.act .d{border-color:var(--gold);color:var(--gold);animation:p 1.6s infinite}
@keyframes p{50%{box-shadow:0 0 0 8px #e3a72f22}}@media(prefers-reduced-motion:reduce){.st.act .d{animation:none}}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:#e3a72f22;color:var(--gold);white-space:nowrap}
.pill.preparing{background:#e3a72f33}.pill.ready,.pill.served{background:#5fd08b22;color:var(--ok)}.pill.pending{background:#d9503f22;color:#ff8b7b}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}
.col h2{font-size:20px;margin-bottom:10px}.n{color:var(--mut);font-family:Manrope;font-size:14px}
.ord{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;padding:14px;margin-bottom:12px}
.ord.preparing{border-left-color:var(--gold)}.ord.ready{border-left-color:var(--ok)}
.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.ord small,.row small{color:var(--mut)}
.note{background:#0c231c;border-radius:8px;padding:6px 10px;margin:8px 0;font-size:13px;color:var(--gold)}
.ord .btn{margin-top:10px;padding:11px}
.top-h{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.top-h a,.top-h button{background:none;color:var(--mut);text-decoration:none;font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row .grow{flex:1;min-width:0}.row small{display:block}.row .em{font-size:26px}
.row input[type=number]{width:90px;margin:0}.row input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--gold)}
.row .em{width:52px;height:52px;border-radius:12px;overflow:hidden;position:relative;display:grid;place-items:center;flex:none;background:#0c231c;font:700 22px Fraunces,serif;color:#e3a72f}.row .em img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ini{font:700 52px Fraunces,serif;color:#e3a72f55}.pbtn{cursor:pointer;color:var(--gold);font-size:13px;font-weight:700;border:1px solid var(--gold);border-radius:8px;padding:5px 10px}.fl{display:block;font-size:13px;color:var(--mut)}.fl input{padding:8px}
.x{background:none;color:var(--red);font-size:18px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:16px 0 4px}
.qr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:16px}
.qc{background:radial-gradient(120% 90% at 50% 0,#1a5040,#0c231c);color:var(--tx);border:2px solid var(--gold);outline:1px solid #e3a72f66;outline-offset:-9px;border-radius:18px;padding:26px 18px 22px;text-align:center;break-inside:avoid;display:flex;flex-direction:column;align-items:center}
.qc .crest{width:46px;height:46px;font-size:17px;margin-bottom:8px}.qc h2{font-size:21px;line-height:1.15}.qc .hn{color:var(--gold);font-size:13px;letter-spacing:.04em;margin:4px 0 16px}
.qc .plate{background:#fff;padding:12px;border-radius:14px;display:grid;place-items:center;min-height:174px;min-width:174px}
.qc .scan{margin-top:16px;color:var(--gold);font-weight:700}.qc h3{font-size:34px;line-height:1.1;margin:2px 0 6px}.qc small{color:var(--mut);font-size:12px}
.mut{color:var(--mut)}.err{color:var(--red);margin-bottom:8px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--gold);color:#241800;padding:8px 18px;border-radius:20px;font-weight:700;z-index:9}
@page{size:A4;margin:10mm}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff;padding:0}.top-h,.tabs,.g,.btn,.noprint{display:none}.wrap{padding:0;max-width:none}.qr{grid-template-columns:repeat(2,1fr);gap:8mm;margin:0}}
</style></head><body><div id="app"></div>
<script>
let D={menu:[],staff:[],orders:[],tables:10,hotel:''};
const tok=()=>sessionStorage.getItem('nv_t');
async function api(p,o={}){const h={'Content-Type':'application/json'};if(tok())h.Authorization='Bearer '+tok();
  const r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});
  const j=await r.json().catch(()=>({}));if(r.status===401&&tok()){sessionStorage.clear();location.hash='#/login'}
  if(!r.ok)throw new Error(j.error||'Something went wrong. Try again.');return j}
async function sync(){try{D=await api('/state'+(mineKey()?'?order='+mineKey():''))}catch(e){}}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'ETB '+Number(n).toLocaleString();
const me=()=>{try{return JSON.parse(sessionStorage.getItem('eah_u'))}catch(e){return null}};
const mineKey=()=>{try{return localStorage.getItem('nv_my')}catch(e){return null}};
const mine=()=>(mineKey()||'').split('.')[0]||null;
const dest=m=>m.cat==='Drink'?'bar':'kitchen';
let cart={},cat='All',sheet=false,at='menu',lerr='',F={nm:'',tb:new URLSearchParams(location.search).get('table')||'',nt:'',q:''};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
const hero=s=>`<div class="hero"><div class="crest">N</div><h1>Nova Digital Menu</h1><p>${esc(D.hotel||'')}${s?' · '+s:''}</p></div>`;
const ost=o=>{const s=o.items.map(i=>i.s);return s.every(x=>x==='served')?'served':s.every(x=>x==='ready'||x==='served')?'ready':s.some(x=>x!=='pending')?'cooking':'new'};
/* Customer */
function qty(id){const n=cart[id]||0;return n?`<div class="q"><button data-a="sub" data-id="${id}" aria-label="Remove one">−</button><b>${n}</b><button data-a="add" data-id="${id}" aria-label="Add one">+</button></div>`:`<button class="add" data-a="add" data-id="${id}">Add</button>`}
function listHTML(){
  const k=F.q.trim().toLowerCase(),L=D.menu.filter(m=>m.on&&(cat==='All'||m.cat===cat)&&m.name.toLowerCase().includes(k));
  return L.map(m=>`<div class="item"><div class="ph"><b class="ini">${esc((m.name||'?')[0])}</b>${m.img?`<img src="${esc(m.img)}" alt="" loading="lazy" onerror="this.remove()">`:''}<span class="chip">${m.prep||10} min</span></div><div class="in"><h3>${esc(m.name)}</h3><div class="pr">${money(m.price)}</div>${qty(m.id)}</div></div>`).join('')||'<p class="mut">Nothing matches. Try another search or category.</p>';
}
function custView(){
  const o=D.orders.find(x=>x.id==mine());if(o)return track(o);
  const cnt=Object.values(cart).reduce((a,b)=>a+b,0),tot=D.menu.reduce((a,m)=>a+(cart[m.id]||0)*m.price,0);
  return hero(F.tb?'Table '+esc(F.tb)+' · Order from your seat':'Order from your seat')+
  `<div class="wrap"><div class="srch"><input id="q" type="search" placeholder="Search the menu" value="${esc(F.q)}"></div>
  <div class="tabs">${[['All','All'],['Food','Food'],['Drink','Drinks'],['Dessert','Desserts']].map(([c,l])=>`<button data-a="tab" data-v="${c}" class="${cat===c?'on':''}">${l}</button>`).join('')}</div>
  <div class="grid" id="lst">${listHTML()}</div><a class="foot" href="#/login">Staff sign in</a></div>
  ${cnt?`<div class="bar"><button class="btn" data-a="cart"><span>${cnt} item${cnt>1?'s':''}</span><span>View cart · ${money(tot)}</span></button></div>`:''}
  ${sheet?`<div class="ov"><div class="sheet"><h2>Your cart</h2>${D.menu.filter(m=>cart[m.id]).map(m=>`<div class="ln"><span>${esc(m.name)}<br><small class="mut">${money(m.price)}</small></span><div class="q"><button data-a="sub" data-id="${m.id}">−</button><b>${cart[m.id]}</b><button data-a="add" data-id="${m.id}">+</button></div><b>${money(cart[m.id]*m.price)}</b></div>`).join('')}
  <div class="ln"><b>Total</b><b class="pr">${money(tot)}</b></div><br>
  <label>Your name<input id="nm" value="${esc(F.nm)}" placeholder="e.g. Abebe"></label>
  <label>Table number<input id="tb" value="${esc(F.tb)}" placeholder="e.g. 11"></label>
  <label>Notes for the kitchen<textarea id="nt" rows="2" placeholder="Less spicy, no onions…">${esc(F.nt)}</textarea></label>
  <button class="btn solid" data-a="send" data-v="later">Order now · pay after meal</button><br><button class="btn solid ghost" data-a="send" data-v="chapa">Pay now with Chapa</button><br><button class="btn solid ghost" data-a="close" style="border-color:var(--line);color:var(--mut)">Keep browsing</button></div></div>`:''}`;
}
function track(o){
  const i=['new','cooking','ready','served'].indexOf(ost(o));
  const S=[['Order received','The kitchen and bar have your order.'],['Being prepared','Your order is being prepared.'],['Ready and on its way','Your order is finished and arriving at your table.']];
  return hero('Order #'+o.id+(o.table?' · Table '+esc(o.table):''))+`<div class="wrap"><div class="steps">${S.map((s,k)=>`<div class="st ${k<i||i===3?'done':k===i?'act':''}"><div class="d">${k<i||i===3?'✓':k+1}</div><div><h3>${s[0]}</h3><p class="mut">${s[1]}</p></div></div>`).join('')}</div>
  <div class="item" style="padding:6px 14px">${o.items.map(x=>`<div class="ln"><span>${x.q} × ${esc(x.n)}</span><span class="pill ${x.s}">${x.s}</span><span>${money(x.q*x.p)}</span></div>`).join('')}<div class="ln"><b>Total</b><b class="pr">${money(o.total)}</b></div><div class="ln"><span class="mut">Payment</span><span>${o.pay==='chapa'?'Chapa (demo)':'Pay after meal'}</span></div></div>
  ${i>=2?'<br><button class="btn solid" data-a="more">Order something else</button>':''}</div>`;
}
/* Login */
function loginView(m){return hero('Staff sign in')+`<div class="wrap"><p class="err">${esc(m||lerr)}</p>
<label>Username<input id="lu" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password"></label>
<button class="btn solid" data-a="login">Sign in</button><a class="foot" href="#/">Back to menu</a></div>`}
/* Kitchen and bar dashboards */
function ago(t){const m=Math.max(0,Math.round((Date.now()-t)/60000));return m?m+' min ago':'just now'}
function dashView(u,d){
  const st=o=>{const s=o.items.filter(i=>i.dest===d).map(i=>i.s);return s.includes('pending')?'pending':s.includes('preparing')?'preparing':s.includes('ready')?'ready':null};
  const cols=[['pending','New orders','Start preparing'],['preparing','Preparing','Mark as ready'],['ready','Ready to serve','Mark served']];
  const os=D.orders.filter(o=>o.items.some(i=>i.dest===d));
  return `<div class="wrap wide"><div class="top-h"><h2>${d==='bar'?'Bar':'Kitchen'} · ${esc(u.name)}</h2><div>${u.role==='admin'?`<a href="#/${d==='bar'?'kitchen':'bar'}">${d==='bar'?'Kitchen':'Bar'}</a> · <a href="#/admin">Admin</a> · `:''}<button data-a="out">Sign out</button></div></div>
  <div class="cols">${cols.map(([s,t,b])=>{const L=os.filter(o=>st(o)===s);return `<div class="col"><h2>${t} <span class="n">${L.length}</span></h2>${L.map(o=>`<div class="ord ${s}"><div class="top"><b>Table ${esc(o.table||'—')} · ${esc(o.name||'Guest')}</b><small>#${o.id} · ${ago(o.t)}</small></div>${o.items.filter(i=>i.dest===d).map(x=>`<div class="ln" style="padding:5px 0"><span><b>${x.q}×</b> ${esc(x.n)}</span><span class="pill ${x.s}">${x.s}</span></div>`).join('')}${o.note?`<div class="note">${esc(o.note)}</div>`:''}<button class="btn solid" data-a="ist" data-id="${o.id}" data-v="${d}">${b}</button></div>`).join('')||'<p class="mut">No orders here.</p>'}</div>`}).join('')}</div></div>`;
}
/* Admin */
function adminView(u){
  const menu=`<div class="g"><input id="an" placeholder="Item name"><select id="ac"><option value="Food">Food</option><option value="Drink">Drink</option><option value="Dessert">Dessert</option></select><input id="ap" type="number" min="0" placeholder="Price (ETB)"><input id="at" type="number" min="1" placeholder="Prep minutes"><label class="fl">Photo<input id="af" type="file" accept="image/*"></label></div><button class="btn solid" data-a="addm">Add to menu</button><br>`+
  D.menu.map(m=>`<div class="row"><span class="em">${esc((m.name||'?')[0])}${m.img?`<img src="${esc(m.img)}" alt="">`:''}</span><div class="grow"><b>${esc(m.name)}</b><small>${m.cat} · ${m.prep||10} min · ${dest(m)}</small></div><input type="number" min="0" value="${m.price}" data-id="${m.id}" data-f="price" aria-label="Price"><label title="Available"><input type="checkbox" data-id="${m.id}" data-f="on" ${m.on?'checked':''}></label><label class="pbtn">${m.img?'Change photo':'Add photo'}<input type="file" accept="image/*" data-photo="${m.id}" hidden></label><button class="x" data-a="delm" data-id="${m.id}" aria-label="Delete">✕</button></div>`).join('');
  const staff=`<div class="g"><input id="sn" placeholder="Full name"><input id="su" placeholder="Username"><input id="sp" placeholder="Password"><select id="sr"><option value="kitchen">Kitchen</option><option value="bar">Bar</option><option value="admin">Admin</option></select></div><button class="btn solid" data-a="adds">Add staff</button><br>`+
  D.staff.map(s=>`<div class="row"><div class="grow"><b>${esc(s.name)}</b><small>@${esc(s.user)} · ${s.role}</small></div>${s.id===u.id?'':`<button class="x" data-a="dels" data-id="${s.id}" aria-label="Remove">✕</button>`}</div>`).join('');
  const base=location.href.split('#')[0].split('?')[0];
  const qr=`<div class="g noprint"><input id="tn" type="number" min="1" max="100" value="${D.tables}" aria-label="Number of tables"></div><button class="btn solid noprint" data-a="tables">Create table QR codes</button><br><button class="btn solid ghost noprint" onclick="print()">Print QR codes</button><p class="mut noprint" style="margin-top:10px;font-size:13px">Links use this page's address: ${esc(base)}. Host the file first, then print.</p><div class="qr">${Array.from({length:D.tables},(_,i)=>`<div class="qc"><div class="crest">N</div><h2>Nova Digital Menu</h2><p class="hn">${esc(D.hotel||'')}</p><div class="plate" data-qr="${esc(base)}?table=${i+1}"></div><p class="scan">Scan to order</p><h3>Table ${i+1}</h3><small>Open your phone camera and point it at the code</small></div>`).join('')}</div>`;
  return `<div class="wrap wide"><div class="top-h"><h2>Admin</h2><div><a href="#/kitchen">Kitchen</a> · <a href="#/bar">Bar</a> · <button data-a="out">Sign out</button></div></div>
  <div class="tabs">${[['menu','Menu & prices'],['staff','Staff'],['qr','Table QR codes']].map(([k,l])=>`<button data-a="atab" data-v="${k}" class="${at===k?'on':''}">${l}</button>`).join('')}</div>${at==='menu'?menu:at==='staff'?staff:qr}</div>`;
}
/* Router */
const route=()=>location.hash.replace('#/','').split('?')[0];
function render(){
  const y=scrollY,h=route(),u=me();let v;
  if(h==='login')v=loginView();
  else if(h==='kitchen'||h==='bar')v=u&&(u.role==='admin'||u.role===h)?dashView(u,h):loginView('Please sign in with a '+h+' account.');
  else if(h==='admin')v=u&&u.role==='admin'?adminView(u):loginView('Admin access only.');
  else v=custView();
  app.innerHTML=v;scrollTo(0,y);
  document.querySelectorAll('[data-qr]').forEach(e=>{try{new QRCode(e,{text:e.dataset.qr,width:150,height:150,correctLevel:QRCode.CorrectLevel.M})}catch(x){e.textContent=e.dataset.qr}});
}
/* Photos: shrink to 900px JPEG in the browser, then upload */
function shrink(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Could not read this photo.')),'image/jpeg',.82)};im.onerror=()=>rej(new Error('That file is not a photo this browser can read. Try a JPG or PNG.'));im.src=u})}
async function upImg(id,file){const b=await shrink(file);const r=await fetch('/api/menu/'+id+'/image',{method:'POST',headers:{'Content-Type':'image/jpeg',Authorization:'Bearer '+tok()},body:b});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Photo upload failed.')}
/* Actions */
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){F.q=t.value;document.getElementById('lst').innerHTML=listHTML()}else if(t.id in F)F[t.id]=t.value});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.photo&&t.files[0]){try{toast('Uploading photo...');await upImg(t.dataset.photo,t.files[0]);await sync();render();toast('Photo saved')}catch(x){toast(x.message)}return}
  const f=t.dataset.f;if(!f)return;
  try{await api('/menu/'+t.dataset.id,{method:'PATCH',body:{[f]:f==='on'?t.checked:Number(t.value)}});toast('Saved')}catch(x){toast(x.message)}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
  const val=i=>(document.getElementById(i)||{}).value||'';
  try{
    if(a==='tab')cat=v;
    else if(a==='add')cart[id]=(cart[id]||0)+1;
    else if(a==='sub'){cart[id]=(cart[id]||0)-1;if(cart[id]<1){delete cart[id];if(!Object.keys(cart).length)sheet=false}}
    else if(a==='cart')sheet=true;
    else if(a==='close')sheet=false;
    else if(a==='send'){const items=Object.entries(cart).map(([i,q])=>({id:+i,q}));if(!items.length)return;
      const r=await api('/orders',{method:'POST',body:{table:F.tb,name:F.nm,note:F.nt,pay:v,items}});
      localStorage.setItem('nv_my',r.id+'.'+r.key);cart={};sheet=false;F.nt='';await sync()}
    else if(a==='more'){localStorage.removeItem('nv_my');await sync()}
    else if(a==='login'){const r=await api('/login',{method:'POST',body:{user:val('lu').trim(),pass:val('lp')}});
      sessionStorage.setItem('nv_t',r.token);sessionStorage.setItem('eah_u',JSON.stringify(r.user));lerr='';await sync();location.hash='#/'+r.user.role;return}
    else if(a==='out'){sessionStorage.clear();D.orders=[];D.staff=[];location.hash='#/login';return}
    else if(a==='ist'){await api('/orders/'+id+'/advance',{method:'POST',body:{dest:v}});await sync()}
    else if(a==='atab')at=v;
    else if(a==='addm'){const r=await api('/menu',{method:'POST',body:{name:val('an'),cat:val('ac'),price:val('ap'),prep:val('at')}});const fl=(document.getElementById('af')||{files:[]}).files[0];
      if(fl){try{await upImg(r.id,fl)}catch(x){toast(x.message)}}await sync();toast('Added')}
    else if(a==='delm'){await api('/menu/'+id,{method:'DELETE'});await sync()}
    else if(a==='adds'){await api('/staff',{method:'POST',body:{name:val('sn'),user:val('su'),pass:val('sp'),role:val('sr')}});await sync();toast('Staff added')}
    else if(a==='dels'){await api('/staff/'+id,{method:'DELETE'});await sync()}
    else if(a==='tables'){await api('/tables',{method:'POST',body:{n:val('tn')}});await sync()}
  }catch(x){if(a==='login')lerr=x.message;else toast(x.message)}
  render();
});
const live=()=>['kitchen','bar'].includes(route())||(!route()&&mine());
addEventListener('hashchange',async()=>{await sync();render()});
try{new EventSource('/api/stream').onmessage=async()=>{await sync();if(live())render()}}catch(e){}
setInterval(async()=>{await sync();if(live())render()},8000);
sync().then(render);
</script></body></html>
